<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Администрирование</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #111827;
    }

    .page {
      min-height: 100vh;
      padding: 30px 20px;
    }

    .login-wrap {
      min-height: calc(100vh - 60px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: min(380px, calc(100vw - 32px));
      background: #e5e7eb;
      border-radius: 20px;
      padding: 28px;
    }

    h1 {
      margin: 0 0 22px;
      text-align: center;
      font-size: 26px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 18px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      padding: 10px 14px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }

    .login-button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      font-size: 18px;
    }

    .message {
      margin-top: 16px;
      text-align: center;
      min-height: 24px;
    }

    .admin-content {
      display: none;
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      background: #e5e7eb;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header h1 {
      text-align: left;
      margin: 0 0 8px;
    }

    .summary {
      color: #475569;
      font-size: 16px;
    }

    .create-button {
      background: #16a34a;
      font-size: 16px;
      padding: 12px 16px;
    }

    .create-panel {
      display: none;
      margin-top: 18px;
      background: white;
      border-radius: 14px;
      padding: 18px;
    }

    .create-panel h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .form-field {
      min-width: 0;
    }

    .form-field.full {
      grid-column: 1 / -1;
    }

    .form-label {
      display: block;
      margin-bottom: 6px;
      color: #475569;
      font-size: 13px;
    }

    .form-input {
      font-size: 16px;
      background: #f8fafc;
    }

    .create-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .cancel-button {
      background: #64748b;
    }

    .users {
      display: grid;
      gap: 18px;
    }

    .user-card {
      background: #e5e7eb;
      border-radius: 20px;
      padding: 22px;
    }

    .user-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .user-name {
      font-size: 24px;
      font-weight: 700;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      background: #cbd5e1;
    }

    .status.active {
      background: #bbf7d0;
    }

    .status.inactive {
      background: #fecaca;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .item {
      background: white;
      border-radius: 12px;
      padding: 12px;
    }

    .label {
      color: #64748b;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .value {
      font-size: 16px;
      font-weight: 600;
      word-break: break-word;
    }

    .link-block {
      background: white;
      border-radius: 12px;
      padding: 14px;
    }

    .link-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
    }

    .link-text {
      flex: 1;
      min-width: 0;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .comment {
      margin-top: 12px;
      color: #475569;
    }

    .empty {
      background: #e5e7eb;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
    }

    .error {
      background: #fecaca;
      color: #7f1d1d;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .success {
      background: #bbf7d0;
      color: #14532d;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-field.full {
        grid-column: auto;
      }
    }

    @media (max-width: 600px) {
      .page {
        padding: 16px;
      }

      .link-row {
        flex-direction: column;
        align-items: stretch;
      }

      .link-text {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div id="loginWrap" class="login-wrap">
      <div class="box">
        <div id="login">
          <h1>Администрирование</h1>

          <input
            id="password"
            type="password"
            placeholder="Пароль"
            autocomplete="current-password"
          >

          <button
            id="loginButton"
            class="login-button"
          >
            Войти
          </button>

          <div
            id="message"
            class="message"
          ></div>
        </div>
      </div>
    </div>

    <div
      id="adminContent"
      class="admin-content"
    >
      <div class="header">
        <div class="header-top">
          <div>
            <h1>Пользователи</h1>
            <div
              id="summary"
              class="summary"
            ></div>
          </div>

          <button
            id="showCreateButton"
            class="create-button"
            type="button"
          >
            + Добавить пользователя
          </button>
        </div>

        <div
          id="createPanel"
          class="create-panel"
        >
          <h2>Новый пользователь</h2>

          <div class="form-grid">
            <div class="form-field">
              <label
                class="form-label"
                for="userName"
              >
                Имя пользователя
              </label>

              <input
                id="userName"
                class="form-input"
                type="text"
                placeholder="Например: Иван"
              >
            </div>

            <div class="form-field">
              <label
                class="form-label"
                for="accessCode"
              >
                Access code
              </label>

              <input
                id="accessCode"
                class="form-input"
                type="text"
                placeholder="Например: IVAN"
              >
            </div>

            <div class="form-field full">
              <label
                class="form-label"
                for="comment"
              >
                Комментарий
              </label>

              <input
                id="comment"
                class="form-input"
                type="text"
                placeholder="Необязательно"
              >
            </div>
          </div>

          <div class="create-actions">
            <button
              id="createUserButton"
              type="button"
            >
              Создать пользователя
            </button>

            <button
              id="cancelCreateButton"
              class="cancel-button"
              type="button"
            >
              Отмена
            </button>
          </div>

          <div
            id="createMessage"
            class="message"
          ></div>
        </div>
      </div>

      <div
        id="error"
        class="error"
        style="display: none;"
      ></div>

      <div
        id="success"
        class="success"
        style="display: none;"
      ></div>

      <div
        id="users"
        class="users"
      ></div>
    </div>

  </div>

  <script>
    const loginWrap =
      document.getElementById("loginWrap");

    const adminContent =
      document.getElementById("adminContent");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    const summary =
      document.getElementById("summary");

    const usersContainer =
      document.getElementById("users");

    const errorBox =
      document.getElementById("error");

    const successBox =
      document.getElementById("success");

    const showCreateButton =
      document.getElementById("showCreateButton");

    const createPanel =
      document.getElementById("createPanel");

    const userNameInput =
      document.getElementById("userName");

    const accessCodeInput =
      document.getElementById("accessCode");

    const commentInput =
      document.getElementById("comment");

    const createUserButton =
      document.getElementById("createUserButton");

    const cancelCreateButton =
      document.getElementById("cancelCreateButton");

    const createMessage =
      document.getElementById("createMessage");

    function formatDate(value) {
      if (!value) return "—";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "—";
      }

      return date.toLocaleString("ru-RU");
    }

    function formatDuration(seconds) {
      const totalSeconds =
        Number(seconds || 0);

      if (totalSeconds < 60) {
        return `${totalSeconds} сек`;
      }

      const totalMinutes =
        Math.floor(totalSeconds / 60);

      if (totalMinutes < 60) {
        return `${totalMinutes} мин`;
      }

      const hours =
        Math.floor(totalMinutes / 60);

      const minutes =
        totalMinutes % 60;

      if (minutes === 0) {
        return `${hours} ч`;
      }

      return `${hours} ч ${minutes} мин`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function copyLink(link, button) {
      try {
        await navigator.clipboard.writeText(link);

        const oldText =
          button.textContent;

        button.textContent =
          "Скопировано";

        setTimeout(() => {
          button.textContent =
            oldText;
        }, 1200);

      } catch (error) {
        window.prompt(
          "Скопируйте ссылку:",
          link
        );
      }
    }

    function renderUsers(users) {
      summary.textContent =
        `Пользователей: ${users.length}`;

      if (!users.length) {
        usersContainer.innerHTML =
          '<div class="empty">Пользователей пока нет.</div>';

        return;
      }

      usersContainer.innerHTML =
        users.map((user) => {
          const sessionText =
            user.session_active
              ? "активна"
              : "неактивна";

          const sessionClass =
            user.session_active
              ? "active"
              : "inactive";

          const link =
            user.personal_link || "";

          return `
            <div class="user-card">
              <div class="user-title">
                <div class="user-name">
                  ${escapeHtml(user.user_name || "Без имени")}
                </div>

                <div class="status ${sessionClass}">
                  ${sessionText}
                </div>
              </div>

              <div class="grid">
                <div class="item">
                  <div class="label">Статус</div>
                  <div class="value">
                    ${escapeHtml(user.status || "—")}
                  </div>
                </div>

                <div class="item">
                  <div class="label">Последняя активность</div>
                  <div class="value">
                    ${escapeHtml(formatDate(user.last_activity))}
                  </div>
                </div>

                <div class="item">
                  <div class="label">Сессий</div>
                  <div class="value">
                    ${escapeHtml(user.total_sessions ?? 0)}
                  </div>
                </div>

                <div class="item">
                  <div class="label">Общее время</div>
                  <div class="value">
                    ${escapeHtml(formatDuration(user.total_usage_seconds))}
                  </div>
                </div>

                <div class="item">
                  <div class="label">Дата выдачи</div>
                  <div class="value">
                    ${escapeHtml(formatDate(user.issued_at))}
                  </div>
                </div>

                <div class="item">
                  <div class="label">Access code</div>
                  <div class="value">
                    ${escapeHtml(user.access_code || "—")}
                  </div>
                </div>
              </div>

              <div class="link-block">
                <div class="label">
                  Персональная ссылка
                </div>

                <div class="link-row">
                  <div class="link-text">
                    ${escapeHtml(link || "—")}
                  </div>

                  ${
                    link
                      ? `
                        <button
                          type="button"
                          data-link="${escapeHtml(link)}"
                          class="copy-button"
                        >
                          Копировать
                        </button>
                      `
                      : ""
                  }
                </div>

                ${
                  user.comment
                    ? `
                      <div class="comment">
                        <strong>Комментарий:</strong>
                        ${escapeHtml(user.comment)}
                      </div>
                    `
                    : ""
                }
              </div>
            </div>
          `;
        }).join("");

      document
        .querySelectorAll(".copy-button")
        .forEach((button) => {
          button.addEventListener(
            "click",
            () => {
              copyLink(
                button.dataset.link,
                button
              );
            }
          );
        });
    }

    async function loadUsers() {
      errorBox.style.display = "none";

      try {
        const response =
          await fetch("/api/admin", {
            method: "GET",
            credentials: "include"
          });

        if (response.status === 401) {
          loginWrap.style.display =
            "flex";

          adminContent.style.display =
            "none";

          return;
        }

        if (!response.ok) {
          throw new Error(
            "Не удалось загрузить пользователей"
          );
        }

        const data =
          await response.json();

        renderUsers(
          data.users || []
        );

        loginWrap.style.display =
          "none";

        adminContent.style.display =
          "block";

      } catch (error) {
        errorBox.textContent =
          error.message;

        errorBox.style.display =
          "block";
      }
    }

    async function loginAdmin() {
      message.textContent = "";

      try {
        const response =
          await fetch("/api/admin", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({
              password:
                passwordInput.value
            })
          });

        if (!response.ok) {
          message.textContent =
            "Неверный пароль";

          passwordInput.value = "";

          return;
        }

        passwordInput.value = "";

        await loadUsers();

      } catch (error) {
        message.textContent =
          "Ошибка соединения";
      }
    }

    function resetCreateForm() {
      userNameInput.value = "";
      accessCodeInput.value = "";
      commentInput.value = "";
      createMessage.textContent = "";
    }

    showCreateButton.addEventListener(
      "click",
      () => {
        createMessage.textContent = "";

        createPanel.style.display =
          createPanel.style.display === "block"
            ? "none"
            : "block";

        if (createPanel.style.display === "block") {
          userNameInput.focus();
        }
      }
    );

    cancelCreateButton.addEventListener(
      "click",
      () => {
        createPanel.style.display =
          "none";

        resetCreateForm();
      }
    );

    async function createUser() {
      createMessage.textContent = "";

      const userName =
        userNameInput.value.trim();

      const accessCode =
        accessCodeInput.value.trim();

      const comment =
        commentInput.value.trim();

      if (!userName || !accessCode) {
        createMessage.textContent =
          "Введите имя пользователя и Access code";

        return;
      }

      createUserButton.disabled =
        true;

      try {
        const response =
          await fetch("/api/admin", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({
              action: "create_user",
              user_name: userName,
              access_code: accessCode,
              comment
            })
          });

        const data =
          await response.json();

        if (!response.ok) {
          createMessage.textContent =
            data.error ||
            "Не удалось создать пользователя";

          return;
        }

        createPanel.style.display =
          "none";

        resetCreateForm();

        await loadUsers();

        successBox.textContent =
          `Пользователь "${data.user.user_name}" создан. Ссылка добавлена в список.`;

        successBox.style.display =
          "block";

        setTimeout(() => {
          successBox.style.display =
            "none";
        }, 5000);

      } catch (error) {
        createMessage.textContent =
          "Ошибка соединения";
      } finally {
        createUserButton.disabled =
          false;
      }
    }

    createUserButton.addEventListener(
      "click",
      createUser
    );

    loginButton.addEventListener(
      "click",
      loginAdmin
    );

    passwordInput.addEventListener(
      "keydown",
      (event) => {
        if (event.key === "Enter") {
          loginAdmin();
        }
      }
    );

    loadUsers();
  </script>
</body>
</html>
